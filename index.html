
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fate/Grand Order | Helper</title>
  <link rel="stylesheet" href="fgo.css">
</head>
<body>

  <header class="hero">
    <div class="eyebrow">CHALDEA • SUPPORT DATABASE</div>
    <h1>Fate / Grand Order</h1>
    <p>Bond tracker & matériaux de farm</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="bond">Bond Level</button>
    <button class="tab" data-tab="farm">Farm</button>
  </nav>

  <main>
    <!-- BOND LEVEL -->
    <section id="bond" class="panel active">
      <div class="section-head">
        <div>
          <h2>Bond Level</h2>
          <p>Priorités en premier · Bond Max en bas</p>
        </div>
        <button id="addServant" class="primary">＋ Ajouter</button>
      </div>

      <div class="toolbar">
        <input id="bondSearch"
          placeholder="Rechercher un servant..."
          class="search">
      </div>

      <div id="servantList"></div>
    </section>

    <!-- FARM -->
    <section id="farm" class="panel">
      <div class="section-head">
        <div>
          <h2>Farm</h2>
          <p>Matériaux et missions associées</p>
        </div>
      </div>

      <input id="farmSearch"
        placeholder="Rechercher un matériau, lieu ou mission..."
        class="search compact">

      <div id="farmList"></div>
    </section>
  </main>

  <!-- AJOUT SERVANT -->
  <dialog id="servantDialog">
    <form id="servantForm">
      <h3>Ajouter un servant</h3>

      <label>
        Nom
        <input name="name" required>
      </label>

      <label>
        Classe
        <input name="classe" placeholder="Saber, Archer...">
      </label>

      <label>
        Priorité
        <input name="priority" placeholder="1 = priorité haute">
      </label>

      <div class="dialog-actions">
        <button type="button" id="cancelDialog" class="ghost">
          Annuler
        </button>
        <button type="submit" class="primary">
          Ajouter
        </button>
      </div>
    </form>
  </dialog>

  <footer>
    Fan-made helper · données sauvegardées dans ton navigateur
  </footer>

  <script src="fgo.js"></script>
</body>
</html>
