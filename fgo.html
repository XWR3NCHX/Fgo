
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fate/Grand Order | Helper</title>
  <link rel="stylesheet" href="fgo.css">
</head>
<body>

  <header class="hero">
    <div class="eyebrow">CHALDEA • SUPPORT DATABASE</div>
    <h1>Fate / Grand Order</h1>
    <p>Bond tracker &amp; matériaux de farm</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="bond" type="button">Bond Level</button>
    <button class="tab" data-tab="farm" type="button">Farm</button>
  </nav>

  <main>

    <!-- BOND LEVEL -->
    <section id="bond" class="panel active">

      <div class="section-head">
        <div>
          <h2>Bond Level</h2>
          <p>Priorités en premier · Bond Max en bas</p>
        </div>

        <button id="addServant" class="primary" type="button">
          ＋ Ajouter
        </button>
      </div>

      <!-- STATISTIQUES -->
      <div class="bond-stats" id="bondStats">
        <div class="stat-card">
          <span class="stat-label">TOTAL SERVANTS</span>
          <strong id="totalCount">0</strong>
        </div>

        <div class="stat-card">
          <span class="stat-label">BOND EN COURS</span>
          <strong id="activeCount">0</strong>
        </div>

        <div class="stat-card">
          <span class="stat-label">BOND MAX</span>
          <strong id="maxCount">0</strong>
        </div>
      </div>

      <div class="toolbar">
        <input
          id="bondSearch"
          type="search"
          placeholder="Rechercher un servant..."
          class="search"
        >
      </div>

      <div id="servantList"></div>

    </section>

    <!-- FARM -->
    <section id="farm" class="panel">

      <div class="section-head">
        <div>
          <h2>Farm</h2>
          <p>Matériaux et missions associées</p>
        </div>
      </div>

      <input
        id="farmSearch"
        type="search"
        placeholder="Rechercher un matériau, lieu ou mission..."
        class="search compact"
      >

      <div id="farmList"></div>

    </section>

  </main>

  <!-- AJOUT SERVANT -->
  <dialog id="servantDialog">
    <form id="servantForm">
      <h3>Ajouter un servant</h3>

      <label>
        Nom
        <input name="name" type="text" required>
      </label>

      <label>
        Classe
        <input name="classe" type="text" placeholder="Saber, Archer...">
      </label>

      <label>
        Priorité
        <input
          name="priority"
          type="number"
          min="1"
          placeholder="1 = priorité haute"
        >
      </label>

      <div class="dialog-actions">
        <button type="button" id="cancelDialog" class="ghost">
          Annuler
        </button>

        <button type="submit" class="primary">
          Ajouter
        </button>
      </div>
    </form>
  </dialog>

  <footer>
    Fan-made helper · données sauvegardées dans ton navigateur
  </footer>

  <script src="fgo.js"></script>
</body>
</html>
